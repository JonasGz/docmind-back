[project]
name = "docmind-back"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "boto3>=1.43.56",
    "fastapi[standard]>=0.140.0",
    "google-auth>=2.56.2",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.48.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pypdf>=6.14.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-env>=1.7.0",
    "reportlab>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
env = ["DATABASE_URL=postgresql+psycopg://docmind:docmind@localhost:5435/docmind_test"]
